aid: getvocal
name: GetVocal
description: >-
  GetVocal builds AI voice and chat agents for regulated, high-volume customer
  operations. Its agents resolve customer conversations end to end while staying
  inside a business's own rules, with human-in-the-loop approval on high-stakes
  actions such as large transactions, high-value returns and sensitive data.
  Products include Agent Builder, Control Tower and a Hybrid Workplace Platform,
  serving telecom, financial services, retail and e-commerce, BPO, healthcare and
  hospitality across 100+ languages. GetVocal ships an agent-native surface — a
  public OpenAPI, an llms.txt guidance file, an ai-plugin manifest and a WebMCP
  tool server — with on-premises, self-hosted, EU-hosted or hybrid deployment.
  Backed by Creandum and Speedinvest.
